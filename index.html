<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Batsho</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--p:#7C3AED;--k:#22B8F5;--bg:#F8F7FF;--c:#fff;--t:#1F2937;--m:#6B7280;--l:#EDE9FE}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--c:#1e1b30;--t:#f3f4f6;--m:#9CA3AF;--l:#2e2850}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto;padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{padding:14px 18px 8px;display:flex;align-items:center;gap:10px}
h1{font-size:24px;font-weight:800}
main{flex:1;overflow-y:auto;padding:4px 14px 16px}
nav{display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:9px 0 7px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}
nav .on{color:var(--p);font-weight:700}
.row{display:flex;align-items:center;gap:12px;background:var(--c);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:start}
.row .tx{flex:1;min-width:0}
.row b{display:block}.row small{color:var(--m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.btn{background:linear-gradient(135deg,var(--k),var(--p));color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}
.sm{padding:7px 14px;font-size:13px}
.dots{padding:6px 10px;color:var(--m);font-size:20px}
.tag{background:var(--l);color:var(--p);border-radius:20px;padding:2px 10px;font-size:12px}
.empty{text-align:center;color:var(--m);padding:60px 20px;line-height:1.9}
.login{margin:auto;padding:28px;text-align:center;display:flex;flex-direction:column;gap:14px;width:100%}
.logo{width:96px;height:96px;margin:auto;border-radius:24px;display:block}
.login input:not([type=checkbox]){background:var(--c);border-radius:12px;padding:13px;text-align:center;border:1px solid var(--l)}
.chk{display:flex;gap:8px;text-align:start;font-size:13px;color:var(--m);align-items:flex-start}
.chk input{margin-top:3px;accent-color:var(--p)}
.top{display:flex;align-items:center;gap:8px;padding:10px 8px;background:var(--c);border-bottom:1px solid var(--l)}
.top b{flex:1}.top button{padding:6px 10px;font-size:20px}
#ml{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--c);align-self:flex-end;border-end-end-radius:4px;line-height:1.6}
.m small{display:block;color:var(--p);font-weight:700;font-size:12px}
.m.me{background:var(--p);color:#fff;align-self:flex-start;border-end-end-radius:16px;border-end-start-radius:4px}
.send{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--c);border-top:1px solid var(--l)}
.send input{flex:1;background:var(--bg);border-radius:22px;padding:10px 16px;cursor:text}
.card{background:var(--c);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.card .av{margin:0 auto 8px;width:70px;height:70px;font-size:30px}
.item{display:block;width:100%;text-align:start;background:var(--c);padding:14px;border-radius:14px;margin-bottom:8px}
.item.red{color:#DC2626}
.legal{padding:18px;line-height:2;overflow-y:auto;flex:1}
#sh .bd{position:fixed;inset:0;background:#0006;z-index:5}
#sh .sh{position:fixed;inset:auto 0 0;z-index:6;background:var(--c);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;max-width:560px;margin:auto}
#sh .sh button{padding:13px;border-radius:12px;background:var(--bg)}
#tt{position:fixed;bottom:90px;inset-inline:0;margin:auto;width:max-content;max-width:86%;background:#111827;color:#fff;padding:10px 18px;border-radius:22px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
#tt.on{opacity:1}
.login .two{display:flex;gap:8px}.login .two button{flex:1}.login .alt{background:var(--l);color:var(--p)}.warn{background:#FEF3C7;color:#92400E;border-radius:12px;padding:10px;font-size:13px}.btn.g{background:#fff;color:#1F2937;border:1px solid var(--l);display:flex;align-items:center;justify-content:center;gap:10px;padding:13px}.login summary{color:var(--m);font-size:13px;cursor:pointer}.login details input,.login details .two{margin-top:10px;width:100%}img.av{object-fit:cover}a.item{text-decoration:none;color:inherit}.chk a{color:var(--p)}.form{padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}.form label{font-size:13px;color:var(--m)}.form input:not([hidden]){background:var(--c);border-radius:12px;padding:13px;border:1px solid var(--l);cursor:text;width:100%}.vt{display:flex;align-items:center;gap:8px;padding:10px 12px}.cx{width:42px;height:42px;border-radius:50%;background:var(--c);box-shadow:0 1px 4px #0002;font-size:17px}.live{background:#EF4444;color:#fff;border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px}.cnt{background:#374151;color:#fff;border-radius:20px;padding:6px 12px;font-size:13px}.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}.sc{position:relative;display:flex;align-items:center;gap:10px;background:var(--c);border-radius:20px;padding:12px;box-shadow:0 2px 8px #0001;text-align:start}.sc .av{width:52px;height:52px}.sc small{display:block;color:var(--m)}.sc.em{justify-content:center;color:var(--m);border:2px dashed var(--l);box-shadow:none;min-height:78px}.gd{position:absolute;bottom:12px;inset-inline-start:52px;width:12px;height:12px;border-radius:50%;background:#22C55E;border:2px solid var(--c)}.aud{display:flex;flex-wrap:wrap;gap:8px;padding:12px;justify-content:center}.aud .av{width:36px;height:36px;font-size:14px}#ml .m{border-radius:22px}.lvbox{flex:1;background:#000;margin:0 12px 8px;border-radius:20px;overflow:hidden;min-height:45vh;position:relative}.lvbox video{width:100%;height:100%;object-fit:cover}</style>
</head>
<body>
<div id="app"></div><div id="vaud" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"></div><div id="sh"></div><div id="tt"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="zego.js" onerror="this.remove()"></script>
<script>
const SB_URL='https://whjyruxlcxgwivyuntub.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoanlydXhsY3hnd2l2eXVudHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzODY3NDIsImV4cCI6MjEwODk2Mjc0Mn0.5Mb3qEyfQ5bIFwOl6YvltfSPjdpuKYtya9ENtkbD-6k';
const ok=!SB_URL.includes('YOUR')&&window.supabase;
const sb=ok?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={discover:'اكتشاف',rooms:'الغرف',live:'مباشر',msgs:'الرسائل',me:'ملفي'},IC={discover:'🔍',rooms:'🏠',live:'🔴',msgs:'💬',me:'👤'};
let S={me:null,tab:'discover',view:null,people:[],rooms:[],blocked:[],msgs:[],convos:{},load:true,lives:[],isModel:0,mreq:null};
const seen=new Set();
const nm=id=>S.me&&id==S.me.id?S.me.name:(S.people.find(x=>x.id==id)||{name:'مستخدم'}).name;
const av=p=>p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" alt="">`:`<span class="av" style="background:${['#7C3AED','#22B8F5','#6366F1','#14B8A6','#F59E0B'][p.name.charCodeAt(0)%5]}">${esc(p.name[0])}</span>`;
const pr=id=>S.me&&id==S.me.id?S.me:S.people.find(x=>x.id==id)||{name:'مستخدم'};
function toast(t){const e=$('#tt');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2500)}
const msgHtml=(m,room)=>`<div class="m ${m.sender==S.me.id?'me':''}">${room&&m.sender!=S.me.id?`<small>${esc(nm(m.sender))}</small>`:''}${esc(m.content)}</div>`;
const login=()=>`<div class="login"><img class="logo" src="icon-192.png" alt="Batsho"><h1>أهلاً بك في Batsho</h1>${ok?'':'<div class="warn">'+(SB_URL.includes('YOUR')?'أضف رابط Supabase والمفتاح في أعلى ملف index.html':'تعذر تحميل مكتبة Supabase. تأكد من الإنترنت وأعد فتح الصفحة')+'</div>'}<label class="chk"><input type="checkbox" id="age"><span>عمري 18 سنة أو أكثر، وأوافق على <a href="terms.html" target="_blank">الشروط</a> و<a href="privacy.html" target="_blank">سياسة الخصوصية</a></span></label><button class="btn g" data-a="google"><b style="color:#4285F4;font-size:18px">G</b>المتابعة عبر Google</button><details><summary>الدخول بالبريد</summary><input type="text" id="nm" placeholder="اسمك المستعار (للحساب الجديد)" maxlength="20"><input type="email" id="em" placeholder="البريد الإلكتروني" dir="ltr"><input type="password" id="pw" placeholder="كلمة المرور (6 أحرف على الأقل)" dir="ltr"><div class="two"><button class="btn" data-a="login">دخول</button><button class="btn alt" data-a="signup">حساب جديد</button></div></details></div>`;
const tabs={
discover:()=>S.people.filter(p=>!S.blocked.includes(p.id)).map(p=>`<div class="row">${av(p)}<div class="tx"><b>${esc(p.name)}</b><small>${esc(p.city||'')} ${esc(p.bio||'')}</small></div><button class="btn sm" data-a="open" data-k="d:${p.id}">راسل</button><button class="dots" data-a="menu" data-k="u:${p.id}">⋮</button></div>`).join('')||'<div class="empty">ما فيه أحد غيرك بعد.<br>ادعُ أصدقاءك للانضمام!</div>',
rooms:()=>S.rooms.map(r=>`<div class="row"><button class="row" style="margin:0;padding:0;background:none" data-a="open" data-k="r:${r.id}">${av(r)}<div class="tx"><b>${esc(r.name)}</b></div><span class="tag">${esc(r.tag||'')}</span></button><button class="dots" data-a="menu" data-k="r:${r.id}">⋮</button></div>`).join(''),
live:()=>S.lives.map(l=>`<button class="row" data-a="watch" data-id="${l.id}">${av(l.profiles||{name:'؟'})}<div class="tx"><b>${esc(l.title)}</b><small>${esc((l.profiles||{}).name||'')}</small></div><span class="live" style="font-size:11px;padding:3px 8px">LIVE</span></button>`).join('')||'<div class="empty">لا توجد بثوث مباشرة الآن</div>',
msgs:()=>{const k=Object.keys(S.convos).filter(id=>!S.blocked.includes(id)).sort((a,b)=>S.convos[b].at.localeCompare(S.convos[a].at));return k.length?k.map(id=>`<button class="row" data-a="open" data-k="d:${id}">${av(pr(id))}<div class="tx"><b>${esc(nm(id))}</b><small>${esc(S.convos[id].t)}</small></div></button>`).join(''):`<div class="empty">ما عندك محادثات بعد.<br><br><button class="btn sm" data-a="tab" data-t="discover">اكتشف الناس</button></div>`},
me:()=>`<div class="card">${av(S.me)}<b style="font-size:18px">${esc(S.me.name)}</b><small style="display:block;color:var(--m)">${esc(S.me.city||'')} ${esc(S.me.bio||'حساب +18')}</small></div><button class="item" data-a="edit">تعديل ملفي</button>${mbtn()}<a class="item" href="privacy.html">سياسة الخصوصية</a><a class="item" href="terms.html">الشروط والأحكام</a><button class="item" data-a="logout">تسجيل الخروج</button><button class="item red" data-a="del">حذف حسابي وبياناتي</button>`};
function chat(k){const room=k[0]=='r',id=k.slice(2),o=room?S.rooms.find(x=>x.id==id):S.people.find(x=>x.id==id),n=o?o.name:'محادثة',L=S.msgs.filter(m=>!S.blocked.includes(m.sender));
if(room)return roomView(L);
return`<div class="top"><button data-a="back">➜</button><b>${esc(n)}</b><button data-a="menu" data-k="${room?'r':'u'}:${id}">⋮</button></div><div id="ml">${L.length?L.map(m=>msgHtml(m,room)).join(''):'<div class="empty">اكتب أول رسالة 👋</div>'}</div><div class="send"><input id="in" placeholder="اكتب رسالة..." maxlength="500" autocomplete="off"><button class="btn sm" data-a="send">إرسال</button></div>`}
const legal=()=>`<div class="top"><button data-a="back">➜</button><b>الشروط والخصوصية</b></div><div class="legal"><p><b>ملاحظة:</b> نص مؤقت. ضع هنا الشروط وسياسة الخصوصية الفعلية، وانشرها أيضًا على رابط عام لأن Google Play يطلبه.</p></div>`;
function edit(){const d=S.draft||S.me;return`<div class="top"><button data-a="back">➜</button><b>تعديل ملفي</b></div><div class="form"><div class="card">${av(S.me)}<button class="btn sm" data-a="pick">تغيير الصورة</button><input type="file" id="af" accept="image/*" hidden></div><label>الاسم المستعار</label><input id="en" maxlength="20" value="${esc(d.name||'')}"><label>المدينة</label><input id="ec" maxlength="30" value="${esc(d.city||'')}"><label>نبذة عنك</label><input id="eb" maxlength="120" value="${esc(d.bio||'')}"><button class="btn" data-a="save">حفظ</button></div>`}
function render(){const a=$('#app');
if(S.load){a.innerHTML='<div class="empty" style="margin:auto">جارٍ التحميل...</div>';return}
if(!S.me){a.innerHTML=login();return}
if(S.view){a.innerHTML=S.view=='legal'?legal():S.view=='edit'?edit():S.view=='mreq'?mreqV():S.view=='mpanel'?mpanel():S.view=='live'?liveV():chat(S.view);const l=$('#ml');if(l)l.scrollTop=l.scrollHeight;paintV();return}
a.innerHTML=`<header><h1>${T[S.tab]}</h1></header><main>${tabs[S.tab]()}</main><nav>${Object.keys(T).map(t=>`<button class="${t==S.tab?'on':''}" data-a="tab" data-t="${t}"><i>${IC[t]}</i>${T[t]}</button>`).join('')}</nav>`}
async function boot(){if(!sb){S.load=false;return render()}
const{data:{session}}=await sb.auth.getSession();
if(!session){S.me=null;S.load=false;return render()}
const u=session.user,um=u.user_metadata||{};let nn=String(um.name||um.full_name||'').trim().slice(0,20);if(nn.length<2)nn='مستخدم';let{data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
if(!p){const r=await sb.from('profiles').insert({id:u.id,name:nn}).select().single();p=r.data}
if(!p){toast('تعذر تجهيز حسابك');await sb.auth.signOut();S.load=false;return render()}
S.me=p;
const[a,b,c,mm,mr]=await Promise.all([sb.from('profiles').select('*').neq('id',p.id).limit(100),sb.from('rooms').select('*').order('id'),sb.from('blocks').select('blocked'),sb.from('models').select('user_id').eq('user_id',p.id).maybeSingle(),sb.from('model_requests').select('*').order('id',{ascending:false}).limit(1)]);
S.people=a.data||[];S.isModel=!!mm.data;S.mreq=(mr.data||[])[0]||null;S.rooms=b.data||[];S.blocked=(c.data||[]).map(x=>x.blocked);
sb.removeAllChannels();
sb.channel('m').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},e=>onMsg(e.new)).subscribe();
S.load=false;render()}
function onMsg(m){if(seen.has(m.id))return;seen.add(m.id);
const k=m.room_id?'r:'+m.room_id:'d:'+(m.sender==S.me.id?m.to_user:m.sender);
if(!m.room_id)S.convos[k.slice(2)]={t:m.content,at:m.created_at};
if(S.blocked.includes(m.sender))return;
if(m.sender==S.me.id){const t=S.msgs.find(x=>x.pend&&x.content==m.content&&x.k==k);if(t){t.id=m.id;t.pend=0;return}}
if(k==S.view){S.msgs.push(m);addDom(m)}
else if(m.to_user==S.me.id)toast('رسالة جديدة من '+nm(m.sender))}
function addDom(m){const l=$('#ml');if(!l)return;if(l.querySelector('.empty'))l.innerHTML='';l.insertAdjacentHTML('beforeend',msgHtml(m,!!m.room_id));l.scrollTop=l.scrollHeight}
const cq=k=>{const id=k.slice(2),me=S.me.id,q=sb.from('messages').select('*');return k[0]=='r'?q.eq('room_id',id):q.or(`and(sender.eq.${me},to_user.eq.${id}),and(sender.eq.${id},to_user.eq.${me})`)};
async function openChat(k){S.view=k;S.msgs=[];S.loaded=null;render();
const{data,error}=await cq(k).order('created_at',{ascending:false}).limit(100);if(error)return toast('تعذر تحميل الرسائل');
S.msgs=data.reverse();S.msgs.forEach(m=>seen.add(m.id));if(S.view==k){S.loaded=k;render()}}
async function send(){const i=$('#in'),t=i.value.trim();if(!t)return;const k=S.view;i.value='';
const row=k[0]=='r'?{room_id:+k.slice(2),content:t}:{to_user:k.slice(2),content:t};
const tmp={id:'t'+Date.now(),sender:S.me.id,content:t,k,pend:1,created_at:new Date().toISOString(),room_id:row.room_id||null,to_user:row.to_user||null};
S.msgs.push(tmp);addDom(tmp);if(k[0]=='d')S.convos[k.slice(2)]={t,at:tmp.created_at};
const{data,error}=await sb.from('messages').insert(row).select().single();
if(error){S.msgs=S.msgs.filter(x=>x!==tmp);if(S.view==k){render();const n=$('#in');if(n)n.value=t}return toast('تعذر الإرسال')}
if(!seen.has(data.id)){seen.add(data.id);tmp.id=data.id;tmp.pend=0}}
async function shrink(f,m){const b=await createImageBitmap(f),k=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
const mbtn=()=>S.isModel?'<button class="item" data-a="mpanel">🎥 لوحة البث</button>':S.mreq&&S.mreq.status=='pending'?'<div class="item">⏳ طلب «كوني موديلز» قيد المراجعة</div>':`<button class="item" data-a="mreq">✨ كوني موديلز</button>${S.mreq&&S.mreq.status=='rejected'?'<small style="color:#DC2626;display:block;margin:-4px 4px 8px">رُفض طلبك السابق'+(S.mreq.note?': '+esc(S.mreq.note):'')+'</small>':''}`;
const mreqV=()=>`<div class="top"><button data-a="back">➜</button><b>كوني موديلز</b></div><div class="form"><p style="color:var(--m);line-height:1.8">البث المباشر للبالغين الموثّقين فقط. أدخل تاريخ ميلادك وصورة هويتك لتراجعها الإدارة. صورة الهوية للتحقق فقط ولا تظهر لأحد.</p>${S.me.avatar_url?'':'<div class="warn">أضف صورة شخصية أولًا من «تعديل ملفي»</div>'}<label>تاريخ الميلاد</label><input id="bd" type="date"><label>صورة الهوية (يظهر فيها تاريخ الميلاد)</label><button class="btn sm" data-a="pickid">اختيار صورة</button><input type="file" id="idf" accept="image/*" hidden><label class="chk"><input type="checkbox" id="mok"><span>أقرّ أن المعلومات صحيحة وأن عمري 18 سنة فأكثر</span></label><button class="btn" data-a="msend">إرسال الطلب</button></div>`;
const mpanel=()=>{const s=S.stats;return`<div class="top"><button data-a="back">➜</button><b>لوحة البث</b></div><div class="form"><div class="card"><b>إحصائياتك</b><div style="color:var(--m);line-height:2">${s?`عدد البثوث: ${s.n}<br>إجمالي مدة البث: ${s.m} دقيقة`:'جارٍ التحميل…'}<br>أرباح الهدايا: 0 <small>(نظام الهدايا قادم)</small></div></div><label>عنوان البث</label><input id="lt" maxlength="60" placeholder="مثال: سهرة الجمعة"><button class="btn" data-a="golive">🔴 ابدأ البث</button></div>`};
async function loadStats(){const{data}=await sb.from('lives').select('started_at,ended_at').eq('host',S.me.id);let m=0;(data||[]).forEach(l=>{if(l.ended_at)m+=(new Date(l.ended_at)-new Date(l.started_at))/60000});S.stats={n:(data||[]).length,m:Math.round(m)};if(S.view=='mpanel')render()}
async function loadLives(){const{data}=await sb.from('lives').select('id,title,host,profiles(name,avatar_url)').is('ended_at',null).gt('started_at',new Date(Date.now()-216e5).toISOString()).order('id',{ascending:false}).limit(50);S.lives=(data||[]).filter(l=>!S.blocked.includes(l.host))}
const liveV=()=>{const l=S.lv;return`<div class="vt"><button class="cx" data-a="lend">✕</button><span class="live">LIVE ●</span><span class="cnt" id="lvn">👥 ${l.n||1}</span><i style="flex:1"></i>${l.host?'':'<button class="cx" data-a="lrep">⚑</button>'}</div><div class="lvbox" id="lvv"></div><div class="aud"><b>${esc(l.title)}</b></div>${l.err?`<div class="warn" style="margin:0 12px 10px;direction:ltr;text-align:left;word-break:break-all">${esc(l.err)}</div>`:''}`};
async function startLive(t){await sb.from('lives').update({ended_at:new Date().toISOString()}).eq('host',S.me.id).is('ended_at',null);
const{data,error}=await sb.from('lives').insert({title:t}).select().single();if(error)return toast('تعذر بدء البث');
S.lv={id:data.id,host:true,title:t};S.view='live';render();liveJoin()}
async function liveJoin(){const lv=S.lv;lv.n=1;
const ch=sb.channel('lv'+lv.id,{config:{presence:{key:S.me.id}}});lv.ch=ch;lv.t=setInterval(async()=>{if(S.lv!==lv)return;const{data}=await sb.from('lives').select('ended_at').eq('id',lv.id).maybeSingle();if(data&&data.ended_at&&S.lv===lv){toast('انتهى البث');liveEnd()}},8000);
ch.on('presence',{event:'sync'},()=>{if(S.lv==lv){lv.n=Object.keys(ch.presenceState()).length;const e=$('#lvn');if(e)e.textContent='👥 '+lv.n}}).subscribe(async st=>{if(st=='SUBSCRIBED')await ch.track({})});
try{await loadZ();if(!window.ZegoExpressEngine)throw{code:'lib'};
const{data,error}=await sb.functions.invoke(ZFN,{body:{live:lv.id}});if(error||!data||!data.token)throw{code:'token',message:await tokErr(error,data)};
if(lv.host&&!data.host)throw{code:'denied'};
const z=new ZegoExpressEngine(data.appId,'');lv.z=z;
z.on('roomStreamUpdate',async(r,t,l)=>{if(S.lv!==lv||lv.host)return;if(t=='ADD'){for(const s of l){const rs=await z.startPlayingStream(s.streamID);z.createRemoteStreamView(rs).play('lvv',{enableAutoplayDialog:true});lv.sid=s.streamID}}else if(l.some(s=>s.streamID==lv.sid)){toast('انتهى البث');liveEnd()}});
await z.loginRoom('live'+lv.id,data.token,{userID:S.me.id,userName:S.me.name},{userUpdate:true});
if(lv.host){lv.ls=await z.createZegoStream({camera:{video:true,audio:true}});try{lv.ls.playVideo($('#lvv'),{mode:'fill'})}catch(e){}await z.startPublishingStream('l_'+lv.id,lv.ls)}}
catch(e){if(S.lv==lv){lv.err=(String((e&&e.code)||'')+' '+String((e&&e.message)||(e&&e.code?'':e))).slice(0,90);render()}}}
async function liveEnd(){const lv=S.lv;if(!lv)return;S.lv=null;clearInterval(lv.t);
try{if(lv.host)await sb.from('lives').update({ended_at:new Date().toISOString()}).eq('id',lv.id);if(lv.z){if(lv.host){lv.z.stopPublishingStream('l_'+lv.id);if(lv.ls)lv.z.destroyStream(lv.ls)}lv.z.logoutRoom('live'+lv.id);lv.z.destroyEngine()}if(lv.ch)sb.removeChannel(lv.ch)}catch(e){}
S.view=lv.host?'mpanel':null;render();if(lv.host)loadStats()}
async function loadZ(){if(window.ZegoExpressEngine)return;for(const u of['https://esm.sh/zego-express-engine-webrtc@3.11.0','https://cdn.jsdelivr.net/npm/zego-express-engine-webrtc@3.11.0/+esm']){try{const m=await import(u),E=m.ZegoExpressEngine||(m.default&&(m.default.ZegoExpressEngine||m.default));if(typeof E=='function'){window.ZegoExpressEngine=E;return}}catch(e){}}}
const ZFN='rapid-handler';
async function tokErr(e,d){try{const b=await e.context.json();return String(b.error||JSON.stringify(b))}catch(x){return String((e&&e.message)||(d&&d.error)||'')}}
let zg=null,vc=null;
const roomView=L=>`<div id="vs"></div><div id="ml" ${vc&&vc.hide?'style="display:none"':''}>${L.length?L.map(m=>msgHtml(m,true)).join(''):'<div class="empty">اكتب أول رسالة 👋</div>'}</div><div class="send"><button class="dots" data-a="heart">❤️</button><input id="in" placeholder="تعليق سريع..." maxlength="500" autocomplete="off"><button class="btn sm" data-a="send">إرسال</button></div>`;
const pu=id=>(vc&&vc.pres[id])||pr(id);
function paintV(){const e=$('#vs');if(!e||!vc)return;
const sk=Object.keys(vc.seats),on=Object.keys(vc.pres);let c='';
for(let i=0;i<4;i++){const id=sk[i];if(id){const p=pu(id),t=vc.talk[id];c+=`<button class="sc" data-a="${id==S.me.id?'seat':'noop'}">${av(p)}<span><b>${esc(p.name)}</b><small>${t?'يتحدث':'يستمع'}</small></span>${t?'<i class="gd"></i>':''}</button>`}else c+='<button class="sc em" data-a="seat">＋ مقعد فارغ</button>'}
const au=on.filter(id=>!vc.seats[id]).slice(0,16).map(id=>av(pu(id))).join('');
e.innerHTML=`<div class="vt"><button class="cx" data-a="back">✕</button>${vc.ok?'<span class="live">LIVE ●</span>':`<span class="cnt" style="font-size:11px;max-width:170px">${vc.err?'⚠ خطأ':'جارٍ الاتصال…'}</span>`}<span class="cnt">👥 ${on.length||1}</span><i style="flex:1"></i><button class="cx" data-a="mic">${vc.pub&&!vc.mute?'🎤':'🔇'}</button><button class="cx" data-a="hide">${vc.hide?'👁':'🙈'}</button><button class="cx" data-a="menu" data-k="r:${vc.id}">⋯</button></div>${vc.err?`<div class="warn" style="margin:0 12px 10px;word-break:break-all;direction:ltr;text-align:left">${esc(vc.err)}</div>`:''}<div class="seats">${c}</div><div class="aud">${au}</div>`}
async function vJoin(id){vLeave();vc={id,seats:{},pres:{},talk:{},pub:0,mute:0,hide:0,ok:0};paintV();
const ch=sb.channel('vr'+id,{config:{presence:{key:S.me.id}}});vc.ch=ch;
ch.on('presence',{event:'sync'},()=>{const s=ch.presenceState(),o={};for(const k in s)o[k]=s[k][0];if(vc&&vc.ch==ch){vc.pres=o;paintV()}}).subscribe(async st=>{if(st=='SUBSCRIBED')await ch.track({name:S.me.name,avatar_url:S.me.avatar_url||null})});
try{await loadZ();if(!window.ZegoExpressEngine)throw{code:'lib'};
const{data,error}=await sb.functions.invoke(ZFN);if(error||!data||!data.token)throw{code:'token',message:await tokErr(error,data)};
const z=new ZegoExpressEngine(data.appId,'');zg=z;
z.on('roomStreamUpdate',async(r,t,l)=>{if(!vc)return;for(const s of l){const u=s.user.userID;if(t=='ADD'){if(u!=S.me.id){const rs=await z.startPlayingStream(s.streamID);z.createRemoteStreamView(rs).play('vaud',{enableAutoplayDialog:true})}vc.seats[u]=1}else{if(u!=S.me.id)z.stopPlayingStream(s.streamID);delete vc.seats[u]}}paintV()});
try{z.setSoundLevelDelegate(true,400);z.on('soundLevelUpdate',l=>{if(!vc)return;vc.talk={};l.forEach(x=>{if(x.soundLevel>5)vc.talk[String(x.streamID).slice(2)]=1});paintV()})}catch(e){}
await z.loginRoom('vr'+id,data.token,{userID:S.me.id,userName:S.me.name},{userUpdate:true});vc.ok=1;paintV()}
catch(e){if(vc){vc.err=(String((e&&e.code)||'')+' '+String((e&&e.message)||(e&&e.code?'':e))).slice(0,80);paintV()}toast('تعذر تشغيل الصوت')}}
async function vSeat(){if(!vc||!vc.ok)return toast('الصوت غير متصل');
if(vc.pub){await vStop();return paintV()}
if(Object.keys(vc.seats).length>=4)return toast('المقاعد ممتلئة');
try{vc.ls=await zg.createZegoStream({camera:{video:false,audio:true}});await zg.startPublishingStream('s_'+S.me.id,vc.ls);vc.pub=1;vc.mute=0;vc.seats[S.me.id]=1;paintV()}catch(e){toast('تعذر تشغيل المايك، اسمح باستخدامه')}}
async function vStop(){try{zg.stopPublishingStream('s_'+S.me.id);zg.destroyStream(vc.ls)}catch(e){}vc.pub=0;vc.ls=null;delete vc.seats[S.me.id]}
function vMic(){if(!vc||!vc.pub)return vSeat();vc.mute=!vc.mute;try{vc.ls.stream.getAudioTracks().forEach(t=>t.enabled=!vc.mute)}catch(e){}paintV()}
function vLeave(){if(!vc)return;const c=vc.ch;try{if(vc.pub)zg.stopPublishingStream('s_'+S.me.id);if(vc.ls)zg.destroyStream(vc.ls);zg.logoutRoom('vr'+vc.id);zg.destroyEngine()}catch(e){}try{if(c)sb.removeChannel(c)}catch(e){}zg=null;vc=null}
let polling=0;
async function poll(){const k=S.view;if(!sb||!S.me||!k||k=='legal'||S.loaded!=k||document.hidden||polling)return;polling=1;
try{const ids=S.msgs.filter(x=>typeof x.id=='number').map(x=>x.id),last=ids.length?Math.max(...ids):0;
const{data}=await cq(k).gt('id',last).order('id',{ascending:true}).limit(50);
if(S.view==k)(data||[]).forEach(onMsg)}catch(e){}polling=0}
setInterval(poll,3000);
async function loadConvos(){const{data}=await sb.from('messages').select('sender,to_user,content,created_at').not('to_user','is',null).order('created_at',{ascending:false}).limit(200);
S.convos={};(data||[]).forEach(m=>{const o=m.sender==S.me.id?m.to_user:m.sender;if(!S.convos[o])S.convos[o]={t:m.content,at:m.created_at}})}
async function auth(up){if(!sb)return toast('أضف مفاتيح Supabase أولًا');
const email=$('#em').value.trim(),password=$('#pw').value,name=$('#nm').value.trim();
if(!email||password.length<6)return toast('اكتب البريد وكلمة مرور من 6 أحرف');
if(up){if(name.length<2)return toast('اكتب اسمًا من حرفين على الأقل');if(!$('#age').checked)return toast('التطبيق لمن عمرهم 18 فأكثر');
const{data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});
if(error)return toast(error.message);
if(data.session)return boot();return toast('تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول')}
const{error}=await sb.auth.signInWithPassword({email,password});
if(error)return toast('البريد أو كلمة المرور غير صحيحة');boot()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset;
switch(d.a){
case'google':{if(!sb)return toast('أضف مفاتيح Supabase أولًا');if(!$('#age').checked)return toast('التطبيق لمن عمرهم 18 فأكثر');const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)toast('تعذر الدخول عبر Google');break}
case'edit':S.draft=null;S.view='edit';render();break;
case'pick':$('#af').click();break;
case'save':{const name=$('#en').value.trim(),city=$('#ec').value.trim(),bio=$('#eb').value.trim();if(name.length<2)return toast('الاسم من حرفين على الأقل');const{data,error}=await sb.from('profiles').update({name,city,bio}).eq('id',S.me.id).select().single();if(error)return toast('تعذر الحفظ');S.me=data;S.draft=null;S.view=null;S.tab='me';toast('تم الحفظ');render();break}
case'mreq':S.idf=null;S.view='mreq';render();break;
case'pickid':$('#idf').click();break;
case'msend':{const bd=$('#bd').value,f=S.idf;if(!S.me.avatar_url)return toast('أضف صورة شخصية أولًا');if(!bd)return toast('اكتب تاريخ ميلادك');if(!f)return toast('اختر صورة الهوية');if(!$('#mok').checked)return toast('أكّد الإقرار');
if((Date.now()-new Date(bd))/31557600000<18)return toast('البث لمن عمره 18 فأكثر');
try{const blob=await shrink(f,1280),path=S.me.id+'/id.jpg',up=await sb.storage.from('verify').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(up.error)throw up.error;
const{data,error}=await sb.from('model_requests').insert({birth_date:bd,id_path:path}).select().single();if(error)throw error;S.mreq=data;S.idf=null;S.view=null;S.tab='me';toast('أُرسل طلبك للإدارة');render()}catch(e){toast('تعذر إرسال الطلب: '+String((e&&(e.message||e.error))||e).slice(0,80))}break}
case'mpanel':S.view='mpanel';S.stats=null;render();loadStats();break;
case'golive':{const t=$('#lt').value.trim();if(!t)return toast('اكتب عنوان البث');startLive(t);break}
case'watch':{const l=S.lives.find(x=>x.id==d.id);S.lv={id:+d.id,host:false,title:l?l.title:''};S.view='live';render();liveJoin();break}
case'lend':liveEnd();break;
case'lrep':sb.from('reports').insert({target:'l:'+S.lv.id}).then(()=>toast('وصلنا بلاغك'));break;
case'login':auth(false);break;
case'signup':auth(true);break;
case'tab':S.tab=d.t;if(d.t=='msgs')await loadConvos();if(d.t=='live')await loadLives();render();break;
case'open':openChat(d.k);if(d.k[0]=='r')vJoin(d.k.slice(2));break;
case'seat':vSeat();break;
case'mic':vMic();break;
case'hide':if(vc){vc.hide=!vc.hide;const l=$('#ml');if(l)l.style.display=vc.hide?'none':'flex';paintV()}break;
case'heart':$('#in').value='❤️';send();break;
case'back':vLeave();S.view=null;if(S.tab=='msgs')await loadConvos();render();break;
case'send':send();break;
case'legal':S.view='legal';render();break;
case'logout':vLeave();await liveEnd();await sb.auth.signOut();sb.removeAllChannels();S.me=null;S.view=null;render();break;
case'del':if(confirm('سيتم حذف حسابك وكل بياناتك نهائيًا. متأكد؟')){try{await sb.storage.from('avatars').remove([S.me.id+'/avatar.jpg'])}catch(x){}const{error}=await sb.rpc('delete_me');if(error)return toast('تعذر الحذف');await sb.auth.signOut();S.me=null;S.view=null;render()}break;
case'menu':{const id=d.k.slice(2),u=d.k[0]=='u',o=u?S.people.find(x=>x.id==id):S.rooms.find(x=>x.id==id);$('#sh').innerHTML=`<div class="bd" data-a="close"></div><div class="sh"><b>${esc(o?o.name:'')}</b><button data-a="report" data-k="${d.k}">إبلاغ عن مخالفة</button>${u?`<button data-a="block" data-k="${d.k}">حظر</button>`:''}<button data-a="close">إلغاء</button></div>`;break}
case'report':$('#sh').innerHTML='';{const{error}=await sb.from('reports').insert({target:d.k});toast(error?'تعذر إرسال البلاغ':'وصلنا بلاغك وسنراجعه')}break;
case'block':{$('#sh').innerHTML='';const id=d.k.slice(2),{error}=await sb.from('blocks').insert({blocked:id});if(error)return toast('تعذر الحظر');S.blocked.push(id);if(S.view=='d:'+id)S.view=null;toast('تم الحظر');render();break}
case'close':$('#sh').innerHTML='';break}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='in')send()});
async function upAvatar(f){if(!f)return;if(!/^image\//.test(f.type))return toast('اختر صورة');
S.draft={name:$('#en').value,city:$('#ec').value,bio:$('#eb').value};
try{const bm=await createImageBitmap(f),s=256,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(bm.width,bm.height);c.getContext('2d').drawImage(bm,(bm.width-m)/2,(bm.height-m)/2,m,m,0,0,s,s);
const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)),path=S.me.id+'/avatar.jpg';
const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(up.error)throw up.error;
const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
const{data,error}=await sb.from('profiles').update({avatar_url:url}).eq('id',S.me.id).select().single();if(error)throw error;
S.me=data;toast('تم تحديث الصورة');render()}catch(e){toast('تعذر رفع الصورة: '+String((e&&(e.message||e.error))||e).slice(0,80))}}
document.addEventListener('change',e=>{if(e.target.id=='af')upAvatar(e.target.files[0]);if(e.target.id=='idf'){S.idf=e.target.files[0];const b=$('[data-a=pickid]');if(b&&S.idf)b.textContent='✔ تم اختيار الصورة'}});
boot();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
