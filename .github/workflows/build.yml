name: BATSHO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # تم إزالة cache: 'npm' لأنه يحتاج package-lock.json وهو غير موجود عندك

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          for f in index.html manifest.json sw.js zego.js privacy.html terms.html icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png; do
            if [ -f "$f" ]; then
              cp "$f" www/
            else
              echo "تحذير: $f غير موجود"
            fi
          done
          ls -la www/

      - name: Add Android platform if needed
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android موجود مسبقاً"
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BATSHO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
